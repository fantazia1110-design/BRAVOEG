    <script src="js/include.js?v=20"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARSfRX09EHrwwMvk7q0Y1VOQuvvtFuADc",
            authDomain: "date-c74fc.firebaseapp.com",
            databaseURL: "https://date-c74fc-default-rtdb.firebaseio.com",
            projectId: "date-c74fc",
            storageBucket: "date-c74fc.firebasestorage.app",
            messagingSenderId: "149705983794",
            appId: "1:149705983794:web:257085b8b55b3f31f1b92b"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        const _dlLang = document.documentElement.lang || 'ar';
        const _dlI18n = {
            orderDetails: _dlLang === 'ar' ? ' ›«’Ì· «·ÿ·»' : _dlLang === 'en' ? 'Order Details' : 'DÈtails de la commande',
            orderNum: _dlLang === 'ar' ? '—ﬁ„ «·ÿ·»:' : _dlLang === 'en' ? 'Order ID:' : 'N∞ de commande :',
            product: _dlLang === 'ar' ? '«·„‰ Ã:' : _dlLang === 'en' ? 'Product:' : 'Produit :',
            digitalProduct: _dlLang === 'ar' ? '„‰ Ã —ﬁ„Ì' : _dlLang === 'en' ? 'Digital Product' : 'Produit numÈrique',
            amountPaid: _dlLang === 'ar' ? '«·„»·€ «·„œ›Ê⁄:' : _dlLang === 'en' ? 'Amount Paid:' : 'Montant payÈ :',
            paymentMethod: _dlLang === 'ar' ? 'ÿ—Ìﬁ… «·œ›⁄:' : _dlLang === 'en' ? 'Payment:' : 'Paiement :',
            name: _dlLang === 'ar' ? '«·«”„:' : _dlLang === 'en' ? 'Name:' : 'Nom :',
            email: _dlLang === 'ar' ? '«·»—Ìœ «·≈·ﬂ —Ê‰Ì:' : _dlLang === 'en' ? 'Email:' : 'Email :',
            orderDate: _dlLang === 'ar' ? ' «—ÌŒ «·ÿ·»:' : _dlLang === 'en' ? 'Order Date:' : 'Date :',
            status: _dlLang === 'ar' ? '«·Õ«·…:' : _dlLang === 'en' ? 'Status:' : 'Statut :',
            confirmed: _dlLang === 'ar' ? '„ƒﬂœ ?' : _dlLang === 'en' ? 'Confirmed ?' : 'ConfirmÈe ?',
            noOrder: _dlLang === 'ar' ? '·« ÌÊÃœ ÿ·»' : _dlLang === 'en' ? 'No Order Found' : 'Aucune commande',
            noOrderMsg: _dlLang === 'ar' ? '·„ Ì „ «·⁄ÀÊ— ⁄·Ï —ﬁ„ «·ÿ·». Ì—ÃÏ «· Õﬁﬁ „‰ —«»ÿ «· Õ„Ì·.' : _dlLang === 'en' ? 'Order ID not found. Please check the download link.' : 'NumÈro introuvable. VÈrifiez le lien.',
            notFound: _dlLang === 'ar' ? '·„ Ì „ «·⁄ÀÊ— ⁄·Ï «·ÿ·»' : _dlLang === 'en' ? 'Order Not Found' : 'Commande introuvable',
            notFoundMsg: _dlLang === 'ar' ? '⁄–—«° ·„ ‰ „ﬂ‰ „‰ «·⁄ÀÊ— ⁄·Ï Â–« «·ÿ·». ﬁœ ÌﬂÊ‰ ﬁœ  „ Õ–›Â √Ê √‰ «·—«»ÿ €Ì— ’ÕÌÕ.' : _dlLang === 'en' ? 'Sorry, we could not find this order. It may have been deleted or the link is invalid.' : 'DÈsolÈ, commande introuvable. Elle a pu Ítre supprimÈe.',
            rejected: _dlLang === 'ar' ? ' „ —›÷ «·ÿ·»' : _dlLang === 'en' ? 'Order Rejected' : 'Commande rejetÈe',
            rejectedMsg: _dlLang === 'ar' ? '⁄–—«° ·„ Ì „  √ﬂÌœ ÿ·»ﬂ. Ì—ÃÏ «· Ê«’· „⁄ «·œ⁄„ «·›‰Ì ··„“Ìœ „‰ «·„⁄·Ê„« .' : _dlLang === 'en' ? 'Sorry, your order was not confirmed. Please contact support.' : 'DÈsolÈ, commande non confirmÈe. Contactez le support.',
            pending: _dlLang === 'ar' ? '«·ÿ·» ·„ Ì „  √ﬂÌœÂ »⁄œ' : _dlLang === 'en' ? 'Order Not Yet Confirmed' : 'Commande non encore confirmÈe',
            pendingMsg: _dlLang === 'ar' ? 'ÿ·»ﬂ ·« Ì“«· ﬁÌœ «·„—«Ã⁄…. ”Ì „ ≈⁄·«„ﬂ ›Ê—  √ﬂÌœ «·œ›⁄. Ì„ﬂ‰ﬂ „ «»⁄… Õ«·… ÿ·»ﬂ „‰ ’›Õ… «·ÿ·»« .' : _dlLang === 'en' ? 'Your order is still under review. You will be notified once confirmed. Track your order from the orders page.' : 'Votre commande est en cours. Vous serez notifiÈ. Suivez-la depuis la page commandes.',
            downloadUnavailable: _dlLang === 'ar' ? '—«»ÿ «· Õ„Ì· €Ì— „ «Õ Õ«·Ì«° Ì—ÃÏ «· Ê«’· „⁄ «·œ⁄„ «·›‰Ì.' : _dlLang === 'en' ? 'Download link unavailable. Please contact support.' : 'Lien indisponible. Contactez le support.',
            dayNames: _dlLang === 'ar' ? ['«·√Õœ','«·≈À‰Ì‰','«·À·«À«¡','«·√—»⁄«¡','«·Œ„Ì”','«·Ã„⁄…','«·”» '] : _dlLang === 'en' ? ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'] : ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'],
            dtLocale: _dlLang === 'ar' ? 'ar-EG' : _dlLang === 'en' ? 'en-US' : 'fr-FR',
            atTime: _dlLang === 'ar' ? '«·”«⁄…' : _dlLang === 'en' ? 'at' : '‡',
            currency: _dlLang === 'ar' ? 'Ã‰ÌÂ' : 'EGP'
        };

        const loadingEl = document.getElementById('loadingContainer');
        const mainEl = document.getElementById('mainContainer');
        const errorEl = document.getElementById('errorContainer');

        function showError(title, msg) {
            loadingEl.style.display = 'none';
            errorEl.style.display = 'block';
            document.getElementById('errorTitle').textContent = title;
            document.getElementById('errorMessage').textContent = msg;
        }

        async function loadOrderFromDB(orderId) {
            try {
                const snap = await get(ref(database, 'orders/' + orderId));
                if (snap.exists()) {
                    const order = snap.val();
                    order.id = orderId;
                    return order;
                }
            } catch(e) {}
            try {
                const allSnap = await get(ref(database, 'orders'));
                if (allSnap.exists()) {
                    const all = allSnap.val();
                    for (const id in all) {
                        if (id === orderId || (all[id].orderId === orderId)) {
                            const order = all[id];
                            order.id = id;
                            return order;
                        }
                    }
                }
            } catch(e) {}
            return null;
        }

        function createConfetti() {
            const colors = ['#667eea', '#764ba2', '#f093fb', '#4facfe', '#10b981', '#fbbf24'];
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 2 + 's';
                    confetti.style.width = (Math.random() * 10 + 5) + 'px';
                    confetti.style.height = confetti.style.width;
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 30);
            }
        }

        function displayOrder(order) {
            loadingEl.style.display = 'none';
            mainEl.style.display = 'block';

            const dt = new Date(order.createdAt || order.orderDate || Date.now());
            const dayNames = _dlI18n.dayNames;
            const fullDate = `${dayNames[dt.getDay()]} - ${dt.toLocaleDateString(_dlI18n.dtLocale)} - ${_dlI18n.atTime} ${dt.toLocaleTimeString(_dlI18n.dtLocale, {hour:'2-digit',minute:'2-digit'})}`;

            document.getElementById('orderDetails').innerHTML = `
                <h2>${_dlI18n.orderDetails}</h2>
                <div class="detail-row">
                    <span class="detail-label">${_dlI18n.orderNum}</span>
                    <span class="detail-value">${order.id || order.orderId || ''}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">${_dlI18n.product}</span>
                    <span class="detail-value">${order.productTitle || _dlI18n.digitalProduct}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">${_dlI18n.amountPaid}</span>
                    <span class="detail-value">${order.price || 0} ${order.currency || _dlI18n.currency}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">${_dlI18n.paymentMethod}</span>
                    <span class="detail-value">${order.paymentMethodName || order.paymentMethod || ''}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">${_dlI18n.name}</span>
                    <span class="detail-value">${order.customerName || ''}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">${_dlI18n.email}</span>
                    <span class="detail-value">${order.customerEmail || ''}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">${_dlI18n.orderDate}</span>
                    <span class="detail-value">${fullDate}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">${_dlI18n.status}</span>
                    <span class="detail-value" style="color: #10b981;">? ${_dlI18n.confirmed}</span>
                </div>
            `;

            const downloadLink = order.downloadLink || '';
            const btn = document.getElementById('downloadBtn');
            if (downloadLink) {
                btn.href = downloadLink;
                btn.style.display = 'inline-flex';
            } else {
                btn.style.display = 'none';
                document.querySelector('.download-section p').textContent = _dlI18n.downloadUnavailable;
            }

            createConfetti();
        }

        const params = new URLSearchParams(window.location.search);
        let orderId = params.get('order');

        if (!orderId) {
            const stored = localStorage.getItem('currentOrder');
            if (stored) {
                try {
                    const parsed = JSON.parse(stored);
                    orderId = parsed.orderId || parsed.id;
                } catch(e) {}
            }
        }

        if (!orderId) {
            showError(_dlI18n.noOrder, _dlI18n.noOrderMsg);
        } else {
            let order = await loadOrderFromDB(orderId);
            if (!order) {
                const stored = localStorage.getItem('currentOrder');
                if (stored) {
                    try { order = JSON.parse(stored); } catch(e) {}
                }
            }
            if (!order) {
                showError(_dlI18n.notFound, _dlI18n.notFoundMsg);
            } else if (order.status === 'confirmed' && order.downloadGranted === true) {
                displayOrder(order);
            } else if (order.status === 'rejected') {
                showError(_dlI18n.rejected, _dlI18n.rejectedMsg);
            } else {
                showError(_dlI18n.pending, _dlI18n.pendingMsg);
            }
        }
    </script>
